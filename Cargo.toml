[package]
name = "cakemaster"
version = "0.1.0"
edition = "2024"
description = "Core object catalog and memory segment management for Cakemaster"
license = "Apache-2.0"

[workspace]
members = [
    "crates/cakemaster-proto",
    "crates/cakemaster-server",
    "crates/coro-rpc",
    "crates/coro-rpc-codegen",
]
default-members = [
    ".",
    "crates/cakemaster-proto",
    "crates/cakemaster-server",
    "crates/coro-rpc",
    "crates/coro-rpc-codegen",
]
resolver = "3"

[workspace.dependencies]
thiserror = "2"

[dependencies]
arc-swap = "1.9"
crossbeam-queue = "0.3"
offset-allocator = "0.2"
parking_lot = "0.12"
scc = "3.8"
thiserror.workspace = true
