[package]
name = "cakemaster"
version = "0.1.0"
edition = "2024"
description = "Mooncake-compatible metadata server and storage catalog"
license = "Apache-2.0"
build = "build.rs"

[workspace]
members = [
    "crates/coro-rpc",
    "crates/coro-rpc-codegen",
]
default-members = [
    ".",
    "crates/coro-rpc",
    "crates/coro-rpc-codegen",
]
resolver = "3"

[workspace.dependencies]
thiserror = "2"

[dependencies]
arc-swap = "1.9"
coro-rpc = { path = "crates/coro-rpc" }
crossbeam-queue = "0.3"
futures-util = "0.3"
log = { version = "0.4", features = ["kv"] }
logforth = { version = "0.30", features = ["append-async", "bridge-log"] }
offset-allocator = "0.2"
parking_lot = "0.12"
scc = "3.8"
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[build-dependencies]
coro-rpc-codegen = { path = "crates/coro-rpc-codegen" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
