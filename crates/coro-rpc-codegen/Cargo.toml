[package]
name = "coro-rpc-codegen"
version = "0.1.0"
edition = "2024"
description = "Thrift IDL code generator for coro-rpc"
license = "Apache-2.0"

[dependencies]
arborium-thrift = "2.18.1"
arborium-tree-sitter = "2.18.1"
heck = "0.5"
md-5 = "0.11"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full"] }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
