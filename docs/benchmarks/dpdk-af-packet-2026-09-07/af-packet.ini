# Software-PMD experiment ONLY. No physical NIC, VFIO or host hugepages required.
# Use inside the disposable user/network namespaces created by compare.sh.
[dpdk]
lcore_mask=4
channel=4
memory=512
no_huge=1
numa_on=0
promiscuous=1
port_list=0
nb_vdev=0
nb_bond=0
thread_mode=0
idle_sleep=0
pkt_tx_delay=0
tso=0
lro=0
tx_csum_offoad_skip=1
extra_eal_args=--no-pci --no-shconf --vdev=net_af_packet0,iface=dpdk0

[port0]
addr=198.18.0.2
netmask=255.255.255.0
broadcast=198.18.0.255
gateway=198.18.0.1

[freebsd.boot]
hz=1000
fd_reserve=1024
kern.ipc.maxsockets=4096
net.inet.tcp.tcbhashsize=4096

[freebsd.sysctl]
kern.ipc.somaxconn=1024
net.inet.tcp.sendspace=65536
net.inet.tcp.recvspace=65536
net.inet.tcp.sendbuf_max=16777216
net.inet.tcp.recvbuf_max=16777216
net.inet.tcp.sendbuf_auto=1
net.inet.tcp.recvbuf_auto=1
net.inet.tcp.delayed_ack=0
net.inet.tcp.msl=2000
